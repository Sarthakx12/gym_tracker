name: gym_tracker
description: "Gym workout tracker with progress charts and Redmi Watch integration."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  fl_chart: ^0.70.2
  flutter_blue_plus: ^1.35.3
  provider: ^6.1.2
  intl: ^0.20.2
  permission_handler: ^11.4.0
  uuid: ^4.5.1
  supabase_flutter: ^2.8.4
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
